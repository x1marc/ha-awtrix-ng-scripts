alias: awtrix ng - new app
sequence:
  - variables:
      prefix: "{{ prefix | default('awtrixng') }}"
      topicname: "{{ topicname | default('') }}"
      text: "{{ text | default('') }}"
      icon: "{{ icon | default('') }}"
      iconmode: "{{ iconmode | default('fixed') }}"
      rainbow: "{{ rainbow | default(false) }}"
      lifetime: "{{ lifetime | default(0) }}"
      duration: "{{ duration | default(3) }}"
      textcase: "{{ textcase | default(0) }}"
      showimmediately: "{{ showimmediately | default('') }}"
      textcolor: "{{ textcolor | default([255, 255, 255]) }}"
      progress: "{{ progress | default(0) }}"
      scrollspeed: "{{ scrollspeed | default(80) }}"
      effect: "{{ effect | default('none') }}"
      palette: "{{ palette | default('none') }}"
      scrollmode: "{{ scrollmode | default('keep') }}"
      repeat: "{{ repeat | default(0) }}"
  - action: mqtt.publish
    metadata: {}
    data:
      evaluate_payload: false
      qos: 0
      retain: false
      topic: "{{ prefix | default('awtrixng', true) }}/cmd/apps/pushed/{{topicname}}"
      payload: |-
        {
          "text": "{{text}}",{% if icon %}
          "icon": "{{icon}}",
          "iconMode": "{{ iconmode }}",{% endif %}
          "durationMs": {{ (duration | int(3)) * 1000 }},
          "lifetimeMs": {{ (lifetime | int(0)) * 1000 }},
          "textCase": "{{ ['inherit','upper','asTyped'][textcase | int(0)] }}",
          "scroll": {"speed": {{ scrollspeed | int(80) }}{% if scrollmode != 'keep' %}, "mode": "{{ scrollmode }}"{% endif %}}{% if effect not in ['none','',None] %},
          "effect": "{{ effect }}"{% endif %}{% if (repeat | int(0)) > 0 %},
          "repeat": {{ repeat | int }}{% endif %}{% if rainbow or palette not in ['none','',None] %},
          "palette": "{{ 'Rainbow' if rainbow else palette }}",
          "textColor": "palette",
          "paletteSpeed": 1{% else %},
          "textColor": {{ (textcolor or [255,255,255]) | tojson }}{% endif %}{% if (progress | int(0)) > 0 %},
          "progress": {{ progress | int }}{% endif %}
        }
  - if:
      - condition: template
        value_template: "{{ showimmediately == true or showimmediately == True}}"
    then:
      - action: mqtt.publish
        metadata: {}
        data:
          evaluate_payload: false
          qos: 0
          retain: false
          topic: "{{ prefix | default('awtrixng', true) }}/cmd/apps/switch"
          payload: "{\"name\": \"{{topicname}}\", \"fast\": true}"
description: "Erstellt/aktualisiert eine Pushed App auf AWTRIX NG (blueforcer/awtrix-ng)."
icon: mdi:led-strip
fields:
  prefix:
    selector:
      text:
    name: prefix
    default: "awtrixng"
    description: MQTT-Prefix deiner AWTRIX-NG-Uhr (z. B. awtrixng)
  topicname:
    selector:
      text: null
    name: topicname
    required: true
    description: Name der App (ein Topic pro App). Nur A-Z a-z 0-9 _ - (max. 32)
  text:
    selector:
      text: null
    name: text
    required: true
    description: Anzuzeigender Text
  icon:
    selector:
      text:
    name: icon
    required: true
    description: Icon-ID, muss auf dem AWTRIX-Dateisystem vorhanden sein
  iconmode:
    selector:
      select:
        options:
          - label: "fest (bleibt stehen)"
            value: fixed
          - label: "einmal wegschieben"
            value: pushOnce
          - label: "mitscrollen (wiederholt)"
            value: push
    name: iconMode
    default: fixed
    description: Icon-Verhalten beim Scrollen (fixed / pushOnce / push)
  scrollspeed:
    selector:
      number:
        min: 0
        max: 200
        step: 5
    name: scrollSpeed
    default: 80
    description: Scroll-Geschwindigkeit (NG-scroll.speed). Standard 80.
  effect:
    selector:
      select:
        options:
          - label: "kein Effekt"
            value: none
          - label: Fade
            value: Fade
          - label: MovingLine
            value: MovingLine
          - label: BrickBreaker
            value: BrickBreaker
          - label: PingPong
            value: PingPong
          - label: Radar
            value: Radar
          - label: Checkerboard
            value: Checkerboard
          - label: Fireworks
            value: Fireworks
          - label: PlasmaCloud
            value: PlasmaCloud
          - label: Ripple
            value: Ripple
          - label: Snake
            value: Snake
          - label: Pacifica
            value: Pacifica
          - label: TheaterChase
            value: TheaterChase
          - label: Plasma
            value: Plasma
          - label: Matrix
            value: Matrix
          - label: SwirlIn
            value: SwirlIn
          - label: SwirlOut
            value: SwirlOut
          - label: LookingEyes
            value: LookingEyes
          - label: TwinklingStars
            value: TwinklingStars
          - label: ColorWaves
            value: ColorWaves
    name: effect
    default: none
    description: Hintergrundeffekt (NG). "kein Effekt" = keiner.
  palette:
    selector:
      select:
        options:
          - label: "keine Palette"
            value: none
          - label: Rainbow
            value: Rainbow
          - label: Cloud
            value: Cloud
          - label: Lava
            value: Lava
          - label: Ocean
            value: Ocean
          - label: Forest
            value: Forest
          - label: Stripe
            value: Stripe
          - label: Party
            value: Party
          - label: Heat
            value: Heat
    name: palette
    default: none
    description: Farbverlauf-Palette fuer den Text (ueberschreibt die Farbe).
  scrollmode:
    selector:
      select:
        options:
          - label: "Standard (Geraet)"
            value: keep
          - label: "static (kein Scrollen)"
            value: static
          - label: wrap
            value: wrap
          - label: loop
            value: loop
          - label: bounce
            value: bounce
    name: scrollMode
    default: keep
    description: Scroll-Modus des Textes
  repeat:
    selector:
      number:
        min: 0
        max: 20
        step: 1
    name: repeat
    default: 0
    description: Wie oft der Text durchlaeuft (0 = aus, nutzt Anzeigedauer)
  rainbow:
    selector:
      boolean:
    name: rainbow
    default: false
    required: true
    description: Regenbogen-Text (NG - via Palette "Rainbow") ja/nein
  lifetime:
    selector:
      number:
        min: 0
        max: 86400
        step: 1
    name: lifetime
    default: 0
    description: App nach X Sekunden verwerfen - 0 = nie
  duration:
    selector:
      number:
        min: 1
        max: 180
        step: 1
    name: duration
    default: 3
    description: Anzeigedauer in Sekunden - Standard 3
  textcase:
    selector:
      number:
        min: 0
        max: 2
        step: 1
    name: textCase
    default: 0
    description: >-
      0 = global (inherit), 1 = Großbuchstaben (upper), 2 = wie gesendet
      (asTyped) - Standard 0
  showimmediately:
    selector:
      boolean:
    name: showImmediately
    required: false
    description: Sofort anzeigen (springt in der App-Reihenfolge vor) - Standard false
  textcolor:
    selector:
      color_rgb:
    name: textcolor
    default:
      - 255
      - 255
      - 255
    required: false
    description: Textfarbe (wird bei rainbow ignoriert)
  progress:
    selector:
      number:
        min: 0
        max: 99
        step: 1
    name: progress
    description: Fortschrittsbalken 0-99 (0 = kein Balken)
    default: 0
mode: parallel
max: 10
