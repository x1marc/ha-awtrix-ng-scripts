# AWTRIX NG – alle Skripte als Home-Assistant-Package.
#
# NUTZUNG (Variante A – Package, empfohlen):
#   1) Diese Datei nach  config/packages/awtrix_ng.yaml  legen.
#   2) Falls Packages noch nicht aktiv sind, in configuration.yaml ergaenzen:
#        homeassistant:
#          packages: !include_dir_named packages
#   3) Entwicklerwerkzeuge -> YAML -> 'Skripte neu laden' (oder HA neu starten).
#
# NUTZUNG (Variante B – scripts.yaml):
#   Die unterste Ebene (die 'awtrix_ng_*:'-Bloecke) OHNE die 'script:'-Zeile
#   und um 2 Leerzeichen ausgerueckt an deine scripts.yaml anhaengen.
#
# Hinweis: 'awtrix ng - firmware update' braucht zusaetzlich den shell_command
# 'awtrix_ng_firmware_update' (siehe README). Prefix-Feld bei dir: awtrixng.

script:

  awtrix_ng_new_app:
    alias: awtrix ng - new app
    sequence:
      - action: mqtt.publish
        metadata: {}
        data:
          evaluate_payload: false
          qos: 0
          retain: false
          topic: "{{ prefix | default('awtrix', true) }}/cmd/apps/pushed/{{topicname}}"
          payload: |-
            {
              "text": "{{text}}",
              "icon": "{{icon}}",
              "durationMs": {{ (duration | int(3)) * 1000 }},
              "lifetimeMs": {{ (lifetime | int(0)) * 1000 }},
              "textCase": "{{ ['inherit','upper','asTyped'][textcase | int(0)] }}",
              "scroll": {"speed": 80}{% if rainbow %},
              "palette": "Rainbow",
              "textColor": "palette",
              "paletteSpeed": 1{% else %},
              "textColor": {{ (textcolor or [255,255,255]) | tojson }}{% endif %}{% if (progress | int(0)) > 0 %},
              "progress": {{ progress | int }}{% endif %}
            }
      - if:
          - condition: template
            value_template: "{{ showimmediately == true or showimmediately == True}}"
        then:
          - action: mqtt.publish
            metadata: {}
            data:
              evaluate_payload: false
              qos: 0
              retain: false
              topic: "{{ prefix | default('awtrix', true) }}/cmd/apps/switch"
              payload: "{\"name\": \"{{topicname}}\", \"fast\": true}"
    description: "Erstellt/aktualisiert eine Pushed App auf AWTRIX NG (blueforcer/awtrix-ng)."
    icon: mdi:led-strip
    fields:
      prefix:
        selector:
          text:
        name: prefix
        default: "awtrix"
        description: MQTT-Prefix deiner AWTRIX-NG-Uhr (z. B. awtrixng)
      topicname:
        selector:
          text: null
        name: topicname
        required: true
        description: Name der App (ein Topic pro App). Nur A-Z a-z 0-9 _ - (max. 32)
      text:
        selector:
          text: null
        name: text
        required: true
        description: Anzuzeigender Text
      icon:
        selector:
          text:
        name: icon
        required: true
        description: Icon-ID, muss auf dem AWTRIX-Dateisystem vorhanden sein
      rainbow:
        selector:
          boolean:
        name: rainbow
        default: false
        required: true
        description: Regenbogen-Text (NG - via Palette "Rainbow") ja/nein
      lifetime:
        selector:
          number:
            min: 0
            max: 86400
            step: 1
        name: lifetime
        default: 0
        description: App nach X Sekunden verwerfen - 0 = nie
      duration:
        selector:
          number:
            min: 1
            max: 180
            step: 1
        name: duration
        default: 3
        description: Anzeigedauer in Sekunden - Standard 3
      textcase:
        selector:
          number:
            min: 0
            max: 2
            step: 1
        name: textCase
        default: 0
        description: >-
          0 = global (inherit), 1 = Großbuchstaben (upper), 2 = wie gesendet
          (asTyped) - Standard 0
      showimmediately:
        selector:
          boolean:
        name: showImmediately
        required: false
        description: Sofort anzeigen (springt in der App-Reihenfolge vor) - Standard false
      textcolor:
        selector:
          color_rgb:
        name: textcolor
        default:
          - 255
          - 255
          - 255
        required: false
        description: Textfarbe (wird bei rainbow ignoriert)
      progress:
        selector:
          number:
            min: 0
            max: 99
            step: 1
        name: progress
        description: Fortschrittsbalken 0-99 (0 = kein Balken)
        default: 0
    mode: parallel
    max: 10

  awtrix_ng_delete_app:
    alias: awtrix ng - delete app
    sequence:
      - action: mqtt.publish
        metadata: {}
        data:
          evaluate_payload: false
          qos: 0
          retain: false
          topic: "{{ prefix | default('awtrix', true) }}/cmd/apps/pushed/{{topicname}}"
          payload: ""
    description: "Löscht eine Pushed App auf AWTRIX NG (leeres Payload)."
    icon: mdi:delete
    fields:
      prefix:
        selector:
          text:
        name: prefix
        default: "awtrix"
        description: MQTT-Prefix deiner AWTRIX-NG-Uhr (z. B. awtrixng)
      topicname:
        selector:
          text:
        name: topicname
        required: true
        description: Name der zu löschenden App
    mode: parallel
    max: 10

  awtrix_ng_notify:
    alias: awtrix ng - notify
    sequence:
      - action: mqtt.publish
        metadata: {}
        data:
          evaluate_payload: false
          qos: 0
          retain: false
          topic: "{{ prefix | default('awtrix', true) }}/cmd/notify"
          payload: |-
            {
              "text": "{{text}}",
              "durationMs": {{ (duration | int(7)) * 1000 }},
              "stack": {{ stack | tojson }},
              "hold": {{ hold | tojson }},
              "wakeup": {{ wakeup | tojson }},
              "textCenter": {{ center | tojson }}{% if icon %},
              "icon": "{{icon}}"{% endif %}{% if blink %},
              "textBlinkMs": 500{% endif %}{% if effect %},
              "effect": "{{effect}}"{% endif %}{% if sound %},
              "sound": "{{sound}}"{% endif %}{% if rainbow %},
              "palette": "Rainbow",
              "textColor": "palette"{% else %},
              "textColor": {{ (textcolor or [255,255,255]) | tojson }}{% endif %}
            }
    description: "Sendet eine Notification an AWTRIX NG (überlagert die laufenden Apps)."
    icon: mdi:bell-ring
    fields:
      prefix:
        selector:
          text:
        name: prefix
        default: "awtrix"
        description: MQTT-Prefix deiner AWTRIX-NG-Uhr (z. B. awtrixng)
      text:
        selector:
          text:
        name: text
        required: true
        description: Anzuzeigender Text
      icon:
        selector:
          text:
        name: icon
        description: Icon-ID (optional)
      duration:
        selector:
          number:
            min: 1
            max: 180
            step: 1
        name: duration
        default: 7
        description: Anzeigedauer in Sekunden (bei hold=true ignoriert)
      hold:
        selector:
          boolean:
        name: hold
        default: false
        description: Bis zum manuellen Verwerfen halten
      stack:
        selector:
          boolean:
        name: stack
        default: true
        description: In Warteschlange stapeln (true) oder aktuelle ersetzen (false)
      wakeup:
        selector:
          boolean:
        name: wakeup
        default: false
        description: Display bei Bedarf einschalten
      center:
        selector:
          boolean:
        name: center
        default: false
        description: Text zentrieren (wenn er passt)
      blink:
        selector:
          boolean:
        name: blink
        default: false
        description: Text blinken lassen
      rainbow:
        selector:
          boolean:
        name: rainbow
        default: false
        description: Regenbogen-Text (via Palette "Rainbow")
      textcolor:
        selector:
          color_rgb:
        name: textcolor
        default:
          - 255
          - 255
          - 255
        description: Textfarbe (bei rainbow ignoriert)
      effect:
        selector:
          text:
        name: effect
        description: >-
          Hintergrundeffekt-Name (leer = keiner). Gültige Namen siehe Geräte-
          Capabilities, z. B. PlasmaCloud, Radar, Matrix.
      sound:
        selector:
          text:
        name: sound
        description: Melodie-Dateiname (optional), muss auf dem Gerät liegen
    mode: parallel
    max: 10

  awtrix_ng_dismiss_notification:
    alias: awtrix ng - dismiss notification
    sequence:
      - action: mqtt.publish
        metadata: {}
        data:
          evaluate_payload: false
          qos: 0
          retain: false
          topic: "{{ prefix | default('awtrix', true) }}/cmd/notify/dismiss{% if name %}/{{name}}{% endif %}"
          payload: ""
    description: >-
      Verwirft die aktuelle Notification – oder, wenn ein Name angegeben ist, eine
      benannte Notification (AWTRIX NG).
    icon: mdi:bell-off
    fields:
      prefix:
        selector:
          text:
        name: prefix
        default: "awtrix"
        description: MQTT-Prefix deiner AWTRIX-NG-Uhr (z. B. awtrixng)
      name:
        selector:
          text:
        name: name
        description: Name der Notification (leer = aktuelle verwerfen)
    mode: parallel
    max: 10

  awtrix_ng_switch_app:
    alias: awtrix ng - switch app
    sequence:
      - choose:
          # Nächste App
          - conditions:
              - condition: template
                value_template: "{{ target | lower == 'next' }}"
            sequence:
              - action: mqtt.publish
                data: { topic: "{{ prefix | default('awtrix', true) }}/cmd/apps/next", payload: "" }
          # Vorherige App
          - conditions:
              - condition: template
                value_template: "{{ target | lower in ['previous', 'prev'] }}"
            sequence:
              - action: mqtt.publish
                data: { topic: "{{ prefix | default('awtrix', true) }}/cmd/apps/previous", payload: "" }
        # Zu benannter App springen
        default:
          - action: mqtt.publish
            metadata: {}
            data:
              evaluate_payload: false
              qos: 0
              retain: false
              topic: "{{ prefix | default('awtrix', true) }}/cmd/apps/switch"
              payload: "{\"name\": \"{{target}}\", \"fast\": {{ fast | tojson }}}"
    description: >-
      Springt zu einer App auf AWTRIX NG. "next"/"previous" blättern weiter, jeder
      andere Wert wird als App-Name interpretiert.
    icon: mdi:arrow-right-bold-box
    fields:
      prefix:
        selector:
          text:
        name: prefix
        default: "awtrix"
        description: MQTT-Prefix deiner AWTRIX-NG-Uhr (z. B. awtrixng)
      target:
        selector:
          text:
        name: target
        required: true
        description: 'App-Name, oder "next" / "previous"'
      fast:
        selector:
          boolean:
        name: fast
        default: true
        description: Sofort umschalten (true) statt mit Übergangsanimation
    mode: parallel
    max: 10

  awtrix_ng_app_order:
    alias: awtrix ng - app order
    sequence:
      - action: mqtt.publish
        metadata: {}
        data:
          evaluate_payload: false
          qos: 0
          retain: false
          topic: "{{ prefix | default('awtrix', true) }}/cmd/apps/order"
          payload: >-
            {
            {%- set o = (order | default('')).split(',') | map('trim') | reject('equalto', '') | list -%}
            {%- set d = (disabled | default('')).split(',') | map('trim') | reject('equalto', '') | list -%}
            {%- set items = [] -%}
            {%- if o | length > 0 -%}{%- set items = items + ['"order": ' ~ (o | tojson)] -%}{%- endif -%}
            {%- if d | length > 0 -%}{%- set items = items + ['"disabled": ' ~ (d | tojson)] -%}{%- endif -%}
            {{ items | join(', ') }}
            }
    description: >-
      Legt Reihenfolge und deaktivierte Apps auf AWTRIX NG fest (kommagetrennte
      App-Namen). ACHTUNG: Nur gelistete Apps in "order" bleiben in dieser
      Reihenfolge sichtbar – prüfe die Namen genau (GET /api/v1/apps).
    icon: mdi:sort
    fields:
      prefix:
        selector:
          text:
        name: prefix
        default: "awtrix"
        description: MQTT-Prefix deiner AWTRIX-NG-Uhr (z. B. awtrixng)
      order:
        selector:
          text:
        name: order
        description: 'Reihenfolge, kommagetrennt (z. B. "Time, weather, Battery")'
      disabled:
        selector:
          text:
        name: disabled
        description: 'Zu deaktivierende Apps, kommagetrennt (optional)'
    mode: parallel
    max: 10

  awtrix_ng_display:
    alias: awtrix ng - display
    sequence:
      - action: mqtt.publish
        metadata: {}
        data:
          evaluate_payload: false
          qos: 0
          retain: false
          topic: "{{ prefix | default('awtrix', true) }}/cmd/display"
          payload: >-
            {
            {%- set items = [] -%}
            {%- if power in ['on', 'off'] -%}
              {%- set items = items + ['"power": ' ~ ((power == 'on') | tojson)] -%}
            {%- endif -%}
            {%- if overlay != 'keep' -%}
              {%- set items = items + ['"overlay": ' ~ ((none if overlay == 'off' else overlay) | tojson)] -%}
            {%- endif -%}
            {{ items | join(', ') }}
            }
    description: >-
      Schaltet das AWTRIX-NG-Display ein/aus und/oder setzt das globale Overlay.
      "beibehalten" lässt den jeweiligen Wert unverändert.
    icon: mdi:monitor
    fields:
      prefix:
        selector:
          text:
        name: prefix
        default: "awtrix"
        description: MQTT-Prefix deiner AWTRIX-NG-Uhr (z. B. awtrixng)
      power:
        selector:
          select:
            options:
              - label: "beibehalten"
                value: keep
              - label: "an"
                value: "on"
              - label: "aus"
                value: "off"
        name: power
        default: keep
        description: Display ein-/ausschalten
      overlay:
        selector:
          select:
            options:
              - label: "beibehalten"
                value: keep
              - label: "aus (kein Overlay)"
                value: "off"
              - label: rain
                value: rain
              - label: snow
                value: snow
              - label: drizzle
                value: drizzle
              - label: storm
                value: storm
              - label: thunder
                value: thunder
              - label: frost
                value: frost
        name: overlay
        default: keep
        description: Wetter-Overlay
    mode: parallel
    max: 10

  awtrix_ng_moodlight:
    alias: awtrix ng - moodlight
    sequence:
      - choose:
          # Aus
          - conditions:
              - condition: template
                value_template: "{{ mode == 'off' }}"
            sequence:
              - action: mqtt.publish
                data: { topic: "{{ prefix | default('awtrix', true) }}/cmd/display/moodlight", payload: "" }
        # An – per Farbe oder Farbtemperatur (Kelvin)
        default:
          - action: mqtt.publish
            metadata: {}
            data:
              evaluate_payload: false
              qos: 0
              retain: false
              topic: "{{ prefix | default('awtrix', true) }}/cmd/display/moodlight"
              payload: >-
                {% if (kelvin | int(0)) > 0 %}{"kelvin": {{ kelvin | int }}, "brightness": {{ brightness | int(120) }}}{% else %}{"color": {{ (color or [255,255,255]) | tojson }}, "brightness": {{ brightness | int(120) }}}{% endif %}
    description: >-
      Flutet das gesamte AWTRIX-NG-Panel mit einer Farbe (oder Farbtemperatur).
      Modus "aus" schaltet das Moodlight ab.
    icon: mdi:television-ambient-light
    fields:
      prefix:
        selector:
          text:
        name: prefix
        default: "awtrix"
        description: MQTT-Prefix deiner AWTRIX-NG-Uhr (z. B. awtrixng)
      mode:
        selector:
          select:
            options:
              - label: "an"
                value: "on"
              - label: "aus"
                value: "off"
        name: mode
        default: "on"
        description: Moodlight ein-/ausschalten
      color:
        selector:
          color_rgb:
        name: color
        default:
          - 255
          - 255
          - 255
        description: Farbe (wird ignoriert, wenn Kelvin > 0)
      kelvin:
        selector:
          number:
            min: 0
            max: 6500
            step: 100
        name: kelvin
        default: 0
        description: Farbtemperatur in Kelvin (0 = Farbe verwenden)
      brightness:
        selector:
          number:
            min: 0
            max: 255
            step: 1
        name: brightness
        default: 120
        description: Helligkeit 0-255
    mode: parallel
    max: 10

  awtrix_ng_indicator:
    alias: awtrix ng - indicator
    sequence:
      - choose:
          # Ausschalten / zurücksetzen
          - conditions:
              - condition: template
                value_template: "{{ mode == 'clear' }}"
            sequence:
              - action: mqtt.publish
                data:
                  topic: "{{ prefix | default('awtrix', true) }}/cmd/indicators/{{ id | int(1) }}"
                  payload: "{}"
        # Setzen: Farbe + optional Blinken/Faden
        default:
          - action: mqtt.publish
            metadata: {}
            data:
              evaluate_payload: false
              qos: 0
              retain: false
              topic: "{{ prefix | default('awtrix', true) }}/cmd/indicators/{{ id | int(1) }}"
              payload: >-
                {"color": {{ (color or [255,0,0]) | tojson }}{% if (blink | int(0)) > 0 %}, "blinkMs": {{ blink | int }}{% endif %}{% if (fade | int(0)) > 0 %}, "fadeMs": {{ fade | int }}{% endif %}}
    description: >-
      Setzt eine der drei seitlichen Status-LEDs (Indicators) auf AWTRIX NG –
      Farbe mit optionalem Blinken/Faden – oder schaltet sie aus.
    icon: mdi:led-on
    fields:
      prefix:
        selector:
          text:
        name: prefix
        default: "awtrix"
        description: MQTT-Prefix deiner AWTRIX-NG-Uhr (z. B. awtrixng)
      id:
        selector:
          number:
            min: 1
            max: 3
            step: 1
        name: id
        default: 1
        required: true
        description: Indicator 1 (oben), 2 (mitte) oder 3 (unten)
      mode:
        selector:
          select:
            options:
              - label: "setzen"
                value: set
              - label: "aus"
                value: clear
        name: mode
        default: set
        description: Setzen oder ausschalten
      color:
        selector:
          color_rgb:
        name: color
        default:
          - 255
          - 0
          - 0
        description: Farbe der LED
      blink:
        selector:
          number:
            min: 0
            max: 5000
            step: 50
        name: blink
        default: 0
        description: Blinkintervall in ms (0 = aus)
      fade:
        selector:
          number:
            min: 0
            max: 5000
            step: 50
        name: fade
        default: 0
        description: Fade-Intervall in ms (0 = aus)
    mode: parallel
    max: 10

  awtrix_ng_sound:
    alias: awtrix ng - sound
    sequence:
      - choose:
          # Stoppen
          - conditions:
              - condition: template
                value_template: "{{ mode == 'stop' }}"
            sequence:
              - action: mqtt.publish
                data: { topic: "{{ prefix | default('awtrix', true) }}/cmd/sounds/stop", payload: "" }
        # Abspielen: gespeicherte Melodie (name), Inline-RTTTL (rtttl) oder Builtin
        default:
          - action: mqtt.publish
            metadata: {}
            data:
              evaluate_payload: false
              qos: 0
              retain: false
              topic: "{{ prefix | default('awtrix', true) }}/cmd/sounds/play"
              payload: "{\"{{type}}\": \"{{value}}\"}"
    description: >-
      Spielt einen Sound auf AWTRIX NG ab (gespeicherte Melodie, Inline-RTTTL oder
      eingebauten Ton) oder stoppt die Wiedergabe.
    icon: mdi:music-note
    fields:
      prefix:
        selector:
          text:
        name: prefix
        default: "awtrix"
        description: MQTT-Prefix deiner AWTRIX-NG-Uhr (z. B. awtrixng)
      mode:
        selector:
          select:
            options:
              - label: "abspielen"
                value: play
              - label: "stoppen"
                value: stop
        name: mode
        default: play
        description: Abspielen oder Stoppen
      type:
        selector:
          select:
            options:
              - label: "gespeicherte Melodie (name)"
                value: name
              - label: "Inline-RTTTL (rtttl)"
                value: rtttl
              - label: "eingebauter Ton (builtin)"
                value: builtin
        name: type
        default: name
        description: Quelle des Sounds (nur bei "abspielen")
      value:
        selector:
          text:
        name: value
        description: >-
          Dateiname / RTTTL-String / Builtin-Name (z. B. "beep", "r2d2" oder
          "two:d=4,o=5,b=200:c,e")
    mode: parallel
    max: 10

  awtrix_ng_radio:
    alias: awtrix ng - radio
    sequence:
      - choose:
          # Stoppen
          - conditions:
              - condition: template
                value_template: "{{ mode == 'stop' }}"
            sequence:
              - action: mqtt.publish
                data: { topic: "{{ prefix | default('awtrix', true) }}/cmd/radio/stop", payload: "" }
        # Abspielen: nach Stationsname, Index oder URL
        default:
          - action: mqtt.publish
            metadata: {}
            data:
              evaluate_payload: false
              qos: 0
              retain: false
              topic: "{{ prefix | default('awtrix', true) }}/cmd/radio/play"
              payload: >-
                {% if by == 'index' %}{"index": {{ value | int(0) }}}{% else %}{"{{by}}": "{{value}}"}{% endif %}
    description: >-
      Startet oder stoppt die Radio-Wiedergabe auf AWTRIX NG (sofern das Gerät
      Audio-Ausgabe/Radio unterstützt).
    icon: mdi:radio
    fields:
      prefix:
        selector:
          text:
        name: prefix
        default: "awtrix"
        description: MQTT-Prefix deiner AWTRIX-NG-Uhr (z. B. awtrixng)
      mode:
        selector:
          select:
            options:
              - label: "abspielen"
                value: play
              - label: "stoppen"
                value: stop
        name: mode
        default: play
        description: Abspielen oder Stoppen
      by:
        selector:
          select:
            options:
              - label: "Stationsname (station)"
                value: station
              - label: "Index (index)"
                value: index
              - label: "URL (url)"
                value: url
        name: by
        default: station
        description: Auswahlart (nur bei "abspielen")
      value:
        selector:
          text:
        name: value
        description: Stationsname / Index / Stream-URL
    mode: parallel
    max: 10

  awtrix_ng_settings:
    alias: awtrix ng - settings (brightness)
    sequence:
      - action: mqtt.publish
        metadata: {}
        data:
          evaluate_payload: false
          qos: 0
          retain: false
          topic: "{{ prefix | default('awtrix', true) }}/cmd/settings"
          payload: >-
            {"autoBrightness": {{ autobrightness | tojson }}{% if not autobrightness %}, "brightness": {{ brightness | int(120) }}{% endif %}}
    description: >-
      Setzt Helligkeit und Auto-Helligkeit auf AWTRIX NG. Bei aktiver
      Auto-Helligkeit wird der manuelle Wert weggelassen.
    icon: mdi:brightness-6
    fields:
      prefix:
        selector:
          text:
        name: prefix
        default: "awtrix"
        description: MQTT-Prefix deiner AWTRIX-NG-Uhr (z. B. awtrixng)
      autobrightness:
        selector:
          boolean:
        name: autoBrightness
        default: false
        description: Automatische Helligkeit (Sensor) ein/aus
      brightness:
        selector:
          number:
            min: 0
            max: 255
            step: 1
        name: brightness
        default: 120
        description: Manuelle Helligkeit 0-255 (nur wenn Auto-Helligkeit aus)
    mode: parallel
    max: 10

  awtrix_ng_reboot:
    alias: awtrix ng - reboot
    sequence:
      - action: mqtt.publish
        metadata: {}
        data:
          evaluate_payload: false
          qos: 0
          retain: false
          topic: "{{ prefix | default('awtrix', true) }}/cmd/device/reboot"
          payload: ""
    description: "Startet die AWTRIX-NG-Uhr neu."
    icon: mdi:restart
    fields:
      prefix:
        selector:
          text:
        name: prefix
        default: "awtrix"
        description: MQTT-Prefix deiner AWTRIX-NG-Uhr (z. B. awtrixng)
    mode: single

  awtrix_ng_firmware_update:
    alias: awtrix ng - firmware update (HTTP/curl)
    sequence:
      # Firmware-Update ist bei NG KEIN MQTT-Befehl -> HTTP-Upload via shell_command.
      # Voraussetzung: shell_command 'awtrix_ng_firmware_update' in configuration.yaml
      # (siehe README) und die .bin liegt auf dem HA-Host.
      - action: shell_command.awtrix_ng_firmware_update
        data:
          ip: "{{ ip }}"
          file: "{{ file }}"
        response_variable: result
      - if:
          - condition: template
            value_template: "{{ result.returncode | default(0) != 0 }}"
        then:
          - stop: >-
              Firmware-Upload fehlgeschlagen (returncode
              {{ result.returncode }}): {{ result.stderr | default('') }}
            error: true
    description: >-
      Lädt eine AWTRIX-NG-Firmware (.bin) per HTTP auf die Uhr (POST /update,
      multipart). Nutzt den shell_command 'awtrix_ng_firmware_update' – siehe README,
      Firmware-Update ist bei NG KEIN MQTT-Befehl.
    icon: mdi:chip
    fields:
      ip:
        selector:
          text:
        name: ip
        required: true
        description: "IP oder Host der Uhr (z. B. 192.168.1.50)"
      file:
        selector:
          text:
        name: file
        required: true
        description: "Pfad zur .bin auf dem HA-Host (z. B. /config/firmware-awtrix-ng.bin)"
    mode: single
