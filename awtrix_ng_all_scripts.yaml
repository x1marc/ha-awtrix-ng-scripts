# AWTRIX NG - alle MQTT-Skripte als Home-Assistant-Package.
#
# NUTZUNG (Variante A - Package, empfohlen):
#   1) Diese Datei nach  config/packages/awtrix_ng.yaml  legen.
#   2) Falls Packages noch nicht aktiv sind, in configuration.yaml ergaenzen:
#        homeassistant:
#          packages: !include_dir_named packages
#   3) Entwicklerwerkzeuge -> YAML -> 'Skripte neu laden' (oder HA neu starten).
#
# NUTZUNG (Variante B - scripts.yaml):
#   Die 'awtrix_ng_*:'-Bloecke OHNE die 'script:'-Zeile und um 2 Leerzeichen
#   ausgerueckt an deine scripts.yaml anhaengen.
#
# NICHT enthalten: 'awtrix ng - firmware update' (braucht zusaetzlich einen
# shell_command in configuration.yaml). Bei Bedarf einzeln aus dem Repo:
# awtrix_ng_firmware_update.yaml (siehe README).
#
# Prefix-Feld ist bereits auf 'awtrixng' voreingestellt.

script:

  awtrix_ng_new_app:
    alias: awtrix ng - new app
    sequence:
      - variables:
          prefix: "{{ prefix | default('awtrixng') }}"
          topicname: "{{ topicname | default('') }}"
          text: "{{ text | default('') }}"
          icon: "{{ icon | default('') }}"
          iconmode: "{{ iconmode | default('fixed') }}"
          rainbow: "{{ rainbow | default(false) }}"
          lifetime: "{{ lifetime | default(0) }}"
          duration: "{{ duration | default(3) }}"
          textcase: "{{ textcase | default(0) }}"
          showimmediately: "{{ showimmediately | default('') }}"
          textcolor: "{{ textcolor | default([255, 255, 255]) }}"
          progress: "{{ progress | default(0) }}"
          scrollspeed: "{{ scrollspeed | default(80) }}"
          effect: "{{ effect | default('none') }}"
          palette: "{{ palette | default('none') }}"
          scrollmode: "{{ scrollmode | default('keep') }}"
          repeat: "{{ repeat | default(0) }}"
      - action: mqtt.publish
        metadata: {}
        data:
          evaluate_payload: false
          qos: 0
          retain: false
          topic: "{{ prefix | default('awtrixng', true) }}/cmd/apps/pushed/{{topicname}}"
          payload: |-
            {
              "text": "{{text}}",
              "icon": "{{icon}}",
              "iconMode": "{{ iconmode }}",
              "durationMs": {{ (duration | int(3)) * 1000 }},
              "lifetimeMs": {{ (lifetime | int(0)) * 1000 }},
              "textCase": "{{ ['inherit','upper','asTyped'][textcase | int(0)] }}",
              "scroll": {"speed": {{ scrollspeed | int(80) }}{% if scrollmode != 'keep' %}, "mode": "{{ scrollmode }}"{% endif %}}{% if effect not in ['none','',None] %},
              "effect": "{{ effect }}"{% endif %}{% if (repeat | int(0)) > 0 %},
              "repeat": {{ repeat | int }}{% endif %}{% if rainbow or palette not in ['none','',None] %},
              "palette": "{{ 'Rainbow' if rainbow else palette }}",
              "textColor": "palette",
              "paletteSpeed": 1{% else %},
              "textColor": {{ (textcolor or [255,255,255]) | tojson }}{% endif %}{% if (progress | int(0)) > 0 %},
              "progress": {{ progress | int }}{% endif %}
            }
      - if:
          - condition: template
            value_template: "{{ showimmediately == true or showimmediately == True}}"
        then:
          - action: mqtt.publish
            metadata: {}
            data:
              evaluate_payload: false
              qos: 0
              retain: false
              topic: "{{ prefix | default('awtrixng', true) }}/cmd/apps/switch"
              payload: "{\"name\": \"{{topicname}}\", \"fast\": true}"
    description: "Erstellt/aktualisiert eine Pushed App auf AWTRIX NG (blueforcer/awtrix-ng)."
    icon: mdi:led-strip
    fields:
      prefix:
        selector:
          text:
        name: prefix
        default: "awtrixng"
        description: MQTT-Prefix deiner AWTRIX-NG-Uhr (z. B. awtrixng)
      topicname:
        selector:
          text: null
        name: topicname
        required: true
        description: Name der App (ein Topic pro App). Nur A-Z a-z 0-9 _ - (max. 32)
      text:
        selector:
          text: null
        name: text
        required: true
        description: Anzuzeigender Text
      icon:
        selector:
          text:
        name: icon
        required: true
        description: Icon-ID, muss auf dem AWTRIX-Dateisystem vorhanden sein
      iconmode:
        selector:
          select:
            options:
              - label: "fest (bleibt stehen)"
                value: fixed
              - label: "einmal wegschieben"
                value: pushOnce
              - label: "mitscrollen (wiederholt)"
                value: push
        name: iconMode
        default: fixed
        description: Icon-Verhalten beim Scrollen (fixed / pushOnce / push)
      scrollspeed:
        selector:
          number:
            min: 0
            max: 200
            step: 5
        name: scrollSpeed
        default: 80
        description: Scroll-Geschwindigkeit (NG-scroll.speed). Standard 80.
      effect:
        selector:
          select:
            options:
              - label: "kein Effekt"
                value: none
              - label: Fade
                value: Fade
              - label: MovingLine
                value: MovingLine
              - label: BrickBreaker
                value: BrickBreaker
              - label: PingPong
                value: PingPong
              - label: Radar
                value: Radar
              - label: Checkerboard
                value: Checkerboard
              - label: Fireworks
                value: Fireworks
              - label: PlasmaCloud
                value: PlasmaCloud
              - label: Ripple
                value: Ripple
              - label: Snake
                value: Snake
              - label: Pacifica
                value: Pacifica
              - label: TheaterChase
                value: TheaterChase
              - label: Plasma
                value: Plasma
              - label: Matrix
                value: Matrix
              - label: SwirlIn
                value: SwirlIn
              - label: SwirlOut
                value: SwirlOut
              - label: LookingEyes
                value: LookingEyes
              - label: TwinklingStars
                value: TwinklingStars
              - label: ColorWaves
                value: ColorWaves
        name: effect
        default: none
        description: Hintergrundeffekt (NG). "kein Effekt" = keiner.
      palette:
        selector:
          select:
            options:
              - label: "keine Palette"
                value: none
              - label: Rainbow
                value: Rainbow
              - label: Cloud
                value: Cloud
              - label: Lava
                value: Lava
              - label: Ocean
                value: Ocean
              - label: Forest
                value: Forest
              - label: Stripe
                value: Stripe
              - label: Party
                value: Party
              - label: Heat
                value: Heat
        name: palette
        default: none
        description: Farbverlauf-Palette fuer den Text (ueberschreibt die Farbe).
      scrollmode:
        selector:
          select:
            options:
              - label: "Standard (Geraet)"
                value: keep
              - label: "static (kein Scrollen)"
                value: static
              - label: wrap
                value: wrap
              - label: loop
                value: loop
              - label: bounce
                value: bounce
        name: scrollMode
        default: keep
        description: Scroll-Modus des Textes
      repeat:
        selector:
          number:
            min: 0
            max: 20
            step: 1
        name: repeat
        default: 0
        description: Wie oft der Text durchlaeuft (0 = aus, nutzt Anzeigedauer)
      rainbow:
        selector:
          boolean:
        name: rainbow
        default: false
        required: true
        description: Regenbogen-Text (NG - via Palette "Rainbow") ja/nein
      lifetime:
        selector:
          number:
            min: 0
            max: 86400
            step: 1
        name: lifetime
        default: 0
        description: App nach X Sekunden verwerfen - 0 = nie
      duration:
        selector:
          number:
            min: 1
            max: 180
            step: 1
        name: duration
        default: 3
        description: Anzeigedauer in Sekunden - Standard 3
      textcase:
        selector:
          number:
            min: 0
            max: 2
            step: 1
        name: textCase
        default: 0
        description: >-
          0 = global (inherit), 1 = Großbuchstaben (upper), 2 = wie gesendet
          (asTyped) - Standard 0
      showimmediately:
        selector:
          boolean:
        name: showImmediately
        required: false
        description: Sofort anzeigen (springt in der App-Reihenfolge vor) - Standard false
      textcolor:
        selector:
          color_rgb:
        name: textcolor
        default:
          - 255
          - 255
          - 255
        required: false
        description: Textfarbe (wird bei rainbow ignoriert)
      progress:
        selector:
          number:
            min: 0
            max: 99
            step: 1
        name: progress
        description: Fortschrittsbalken 0-99 (0 = kein Balken)
        default: 0
    mode: parallel
    max: 10

  awtrix_ng_delete_app:
    alias: awtrix ng - delete app
    sequence:
      - variables:
          prefix: "{{ prefix | default('awtrixng') }}"
          topicname: "{{ topicname | default('') }}"
      - action: mqtt.publish
        metadata: {}
        data:
          evaluate_payload: false
          qos: 0
          retain: false
          topic: "{{ prefix | default('awtrixng', true) }}/cmd/apps/pushed/{{topicname}}"
          payload: ""
    description: "Löscht eine Pushed App auf AWTRIX NG (leeres Payload)."
    icon: mdi:delete
    fields:
      prefix:
        selector:
          text:
        name: prefix
        default: "awtrixng"
        description: MQTT-Prefix deiner AWTRIX-NG-Uhr (z. B. awtrixng)
      topicname:
        selector:
          text:
        name: topicname
        required: true
        description: Name der zu löschenden App
    mode: parallel
    max: 10

  awtrix_ng_notify:
    alias: awtrix ng - notify
    sequence:
      - variables:
          prefix: "{{ prefix | default('awtrixng') }}"
          text: "{{ text | default('') }}"
          icon: "{{ icon | default('') }}"
          duration: "{{ duration | default(7) }}"
          hold: "{{ hold | default(false) }}"
          stack: "{{ stack | default(true) }}"
          wakeup: "{{ wakeup | default(false) }}"
          center: "{{ center | default(false) }}"
          blink: "{{ blink | default(false) }}"
          rainbow: "{{ rainbow | default(false) }}"
          textcolor: "{{ textcolor | default([255, 255, 255]) }}"
          effect: "{{ effect | default('none') }}"
          sound: "{{ sound | default('') }}"
          iconmode: "{{ iconmode | default('fixed') }}"
          scrollspeed: "{{ scrollspeed | default(80) }}"
          palette: "{{ palette | default('none') }}"
          scrollmode: "{{ scrollmode | default('keep') }}"
          repeat: "{{ repeat | default(0) }}"
      - action: mqtt.publish
        metadata: {}
        data:
          evaluate_payload: false
          qos: 0
          retain: false
          topic: "{{ prefix | default('awtrixng', true) }}/cmd/notify"
          payload: |-
            {
              "text": "{{text}}",
              "durationMs": {{ (duration | int(7)) * 1000 }},
              "stack": {{ stack | tojson }},
              "hold": {{ hold | tojson }},
              "wakeup": {{ wakeup | tojson }},
              "textCenter": {{ center | tojson }},
              "scroll": {"speed": {{ scrollspeed | int(80) }}{% if scrollmode != 'keep' %}, "mode": "{{ scrollmode }}"{% endif %}}{% if icon %},
              "icon": "{{icon}}","iconMode":"{{iconmode}}"{% endif %}{% if blink %},
              "textBlinkMs": 500{% endif %}{% if effect not in ['none','',None] %},
              "effect": "{{effect}}"{% endif %}{% if (repeat | int(0)) > 0 %},
              "repeat": {{ repeat | int }}{% endif %}{% if sound %},
              "sound": "{{sound}}"{% endif %}{% if rainbow or palette not in ['none','',None] %},
              "palette": "{{ 'Rainbow' if rainbow else palette }}",
              "textColor": "palette"{% else %},
              "textColor": {{ (textcolor or [255,255,255]) | tojson }}{% endif %}
            }
    description: "Sendet eine Notification an AWTRIX NG (überlagert die laufenden Apps)."
    icon: mdi:bell-ring
    fields:
      prefix:
        selector:
          text:
        name: prefix
        default: "awtrixng"
        description: MQTT-Prefix deiner AWTRIX-NG-Uhr (z. B. awtrixng)
      text:
        selector:
          text:
        name: text
        required: true
        description: Anzuzeigender Text
      icon:
        selector:
          text:
        name: icon
        description: Icon-ID (optional)
      iconmode:
        selector:
          select:
            options:
              - label: "fest (bleibt stehen)"
                value: fixed
              - label: "einmal wegschieben"
                value: pushOnce
              - label: "mitscrollen (wiederholt)"
                value: push
        name: iconMode
        default: fixed
        description: Icon-Verhalten beim Scrollen (fixed / pushOnce / push)
      scrollspeed:
        selector:
          number:
            min: 0
            max: 200
            step: 5
        name: scrollSpeed
        default: 80
        description: Scroll-Geschwindigkeit (NG-scroll.speed). Standard 80.
      duration:
        selector:
          number:
            min: 1
            max: 180
            step: 1
        name: duration
        default: 7
        description: Anzeigedauer in Sekunden (bei hold=true ignoriert)
      hold:
        selector:
          boolean:
        name: hold
        default: false
        description: Bis zum manuellen Verwerfen halten
      stack:
        selector:
          boolean:
        name: stack
        default: true
        description: In Warteschlange stapeln (true) oder aktuelle ersetzen (false)
      wakeup:
        selector:
          boolean:
        name: wakeup
        default: false
        description: Display bei Bedarf einschalten
      center:
        selector:
          boolean:
        name: center
        default: false
        description: Text zentrieren (wenn er passt)
      blink:
        selector:
          boolean:
        name: blink
        default: false
        description: Text blinken lassen
      rainbow:
        selector:
          boolean:
        name: rainbow
        default: false
        description: Regenbogen-Text (via Palette "Rainbow")
      textcolor:
        selector:
          color_rgb:
        name: textcolor
        default:
          - 255
          - 255
          - 255
        description: Textfarbe (bei rainbow ignoriert)
      effect:
        selector:
          select:
            options:
              - label: "kein Effekt"
                value: none
              - label: Fade
                value: Fade
              - label: MovingLine
                value: MovingLine
              - label: BrickBreaker
                value: BrickBreaker
              - label: PingPong
                value: PingPong
              - label: Radar
                value: Radar
              - label: Checkerboard
                value: Checkerboard
              - label: Fireworks
                value: Fireworks
              - label: PlasmaCloud
                value: PlasmaCloud
              - label: Ripple
                value: Ripple
              - label: Snake
                value: Snake
              - label: Pacifica
                value: Pacifica
              - label: TheaterChase
                value: TheaterChase
              - label: Plasma
                value: Plasma
              - label: Matrix
                value: Matrix
              - label: SwirlIn
                value: SwirlIn
              - label: SwirlOut
                value: SwirlOut
              - label: LookingEyes
                value: LookingEyes
              - label: TwinklingStars
                value: TwinklingStars
              - label: ColorWaves
                value: ColorWaves
        name: effect
        default: none
        description: Hintergrundeffekt (NG). "kein Effekt" = keiner.
      sound:
        selector:
          text:
        name: sound
        description: Melodie-Dateiname (optional), muss auf dem Gerät liegen
      palette:
        selector:
          select:
            options:
              - label: "keine Palette"
                value: none
              - label: Rainbow
                value: Rainbow
              - label: Cloud
                value: Cloud
              - label: Lava
                value: Lava
              - label: Ocean
                value: Ocean
              - label: Forest
                value: Forest
              - label: Stripe
                value: Stripe
              - label: Party
                value: Party
              - label: Heat
                value: Heat
        name: palette
        default: none
        description: Farbverlauf-Palette fuer den Text (ueberschreibt die Farbe).
      scrollmode:
        selector:
          select:
            options:
              - label: "Standard (Geraet)"
                value: keep
              - label: "static (kein Scrollen)"
                value: static
              - label: wrap
                value: wrap
              - label: loop
                value: loop
              - label: bounce
                value: bounce
        name: scrollMode
        default: keep
        description: Scroll-Modus des Textes
      repeat:
        selector:
          number:
            min: 0
            max: 20
            step: 1
        name: repeat
        default: 0
        description: Wie oft der Text durchlaeuft (0 = aus, nutzt Anzeigedauer)
    mode: parallel
    max: 10

  awtrix_ng_dismiss_notification:
    alias: awtrix ng - dismiss notification
    sequence:
      - variables:
          prefix: "{{ prefix | default('awtrixng') }}"
          name: "{{ name | default('') }}"
      - action: mqtt.publish
        metadata: {}
        data:
          evaluate_payload: false
          qos: 0
          retain: false
          topic: "{{ prefix | default('awtrixng', true) }}/cmd/notify/dismiss{% if name %}/{{name}}{% endif %}"
          payload: ""
    description: >-
      Verwirft die aktuelle Notification – oder, wenn ein Name angegeben ist, eine
      benannte Notification (AWTRIX NG).
    icon: mdi:bell-off
    fields:
      prefix:
        selector:
          text:
        name: prefix
        default: "awtrixng"
        description: MQTT-Prefix deiner AWTRIX-NG-Uhr (z. B. awtrixng)
      name:
        selector:
          text:
        name: name
        description: Name der Notification (leer = aktuelle verwerfen)
    mode: parallel
    max: 10

  awtrix_ng_switch_app:
    alias: awtrix ng - switch app
    sequence:
      - variables:
          prefix: "{{ prefix | default('awtrixng') }}"
          target: "{{ target | default('') }}"
          fast: "{{ fast | default(true) }}"
      - choose:
          # Nächste App
          - conditions:
              - condition: template
                value_template: "{{ target | lower == 'next' }}"
            sequence:
              - action: mqtt.publish
                data: { topic: "{{ prefix | default('awtrixng', true) }}/cmd/apps/next", payload: "" }
          # Vorherige App
          - conditions:
              - condition: template
                value_template: "{{ target | lower in ['previous', 'prev'] }}"
            sequence:
              - action: mqtt.publish
                data: { topic: "{{ prefix | default('awtrixng', true) }}/cmd/apps/previous", payload: "" }
        # Zu benannter App springen
        default:
          - action: mqtt.publish
            metadata: {}
            data:
              evaluate_payload: false
              qos: 0
              retain: false
              topic: "{{ prefix | default('awtrixng', true) }}/cmd/apps/switch"
              payload: "{\"name\": \"{{target}}\", \"fast\": {{ fast | tojson }}}"
    description: >-
      Springt zu einer App auf AWTRIX NG. "next"/"previous" blättern weiter, jeder
      andere Wert wird als App-Name interpretiert.
    icon: mdi:arrow-right-bold-box
    fields:
      prefix:
        selector:
          text:
        name: prefix
        default: "awtrixng"
        description: MQTT-Prefix deiner AWTRIX-NG-Uhr (z. B. awtrixng)
      target:
        selector:
          text:
        name: target
        required: true
        description: 'App-Name, oder "next" / "previous"'
      fast:
        selector:
          boolean:
        name: fast
        default: true
        description: Sofort umschalten (true) statt mit Übergangsanimation
    mode: parallel
    max: 10

  awtrix_ng_app_order:
    alias: awtrix ng - app order
    sequence:
      - variables:
          prefix: "{{ prefix | default('awtrixng') }}"
          order: "{{ order | default('') }}"
          disabled: "{{ disabled | default('') }}"
      - action: mqtt.publish
        metadata: {}
        data:
          evaluate_payload: false
          qos: 0
          retain: false
          topic: "{{ prefix | default('awtrixng', true) }}/cmd/apps/order"
          payload: >-
            {
            {%- set o = (order | default('')).split(',') | map('trim') | reject('equalto', '') | list -%}
            {%- set d = (disabled | default('')).split(',') | map('trim') | reject('equalto', '') | list -%}
            {%- set items = [] -%}
            {%- if o | length > 0 -%}{%- set items = items + ['"order": ' ~ (o | tojson)] -%}{%- endif -%}
            {%- if d | length > 0 -%}{%- set items = items + ['"disabled": ' ~ (d | tojson)] -%}{%- endif -%}
            {{ items | join(', ') }}
            }
    description: >-
      Legt Reihenfolge und deaktivierte Apps auf AWTRIX NG fest (kommagetrennte
      App-Namen). ACHTUNG: Nur gelistete Apps in "order" bleiben in dieser
      Reihenfolge sichtbar – prüfe die Namen genau (GET /api/v1/apps).
    icon: mdi:sort
    fields:
      prefix:
        selector:
          text:
        name: prefix
        default: "awtrixng"
        description: MQTT-Prefix deiner AWTRIX-NG-Uhr (z. B. awtrixng)
      order:
        selector:
          text:
        name: order
        description: 'Reihenfolge, kommagetrennt (z. B. "Time, weather, Battery")'
      disabled:
        selector:
          text:
        name: disabled
        description: 'Zu deaktivierende Apps, kommagetrennt (optional)'
    mode: parallel
    max: 10

  awtrix_ng_display:
    alias: awtrix ng - display
    sequence:
      - variables:
          prefix: "{{ prefix | default('awtrixng') }}"
          power: "{{ power | default('keep') }}"
          overlay: "{{ overlay | default('keep') }}"
      - action: mqtt.publish
        metadata: {}
        data:
          evaluate_payload: false
          qos: 0
          retain: false
          topic: "{{ prefix | default('awtrixng', true) }}/cmd/display"
          payload: >-
            {
            {%- set items = [] -%}
            {%- if power in ['on', 'off'] -%}
              {%- set items = items + ['"power": ' ~ ((power == 'on') | tojson)] -%}
            {%- endif -%}
            {%- if overlay != 'keep' -%}
              {%- set items = items + ['"overlay": ' ~ ((none if overlay == 'off' else overlay) | tojson)] -%}
            {%- endif -%}
            {{ items | join(', ') }}
            }
    description: >-
      Schaltet das AWTRIX-NG-Display ein/aus und/oder setzt das globale Overlay.
      "beibehalten" lässt den jeweiligen Wert unverändert.
    icon: mdi:monitor
    fields:
      prefix:
        selector:
          text:
        name: prefix
        default: "awtrixng"
        description: MQTT-Prefix deiner AWTRIX-NG-Uhr (z. B. awtrixng)
      power:
        selector:
          select:
            options:
              - label: "beibehalten"
                value: keep
              - label: "an"
                value: "on"
              - label: "aus"
                value: "off"
        name: power
        default: keep
        description: Display ein-/ausschalten
      overlay:
        selector:
          select:
            options:
              - label: "beibehalten"
                value: keep
              - label: "aus (kein Overlay)"
                value: "off"
              - label: rain
                value: rain
              - label: snow
                value: snow
              - label: drizzle
                value: drizzle
              - label: storm
                value: storm
              - label: thunder
                value: thunder
              - label: frost
                value: frost
        name: overlay
        default: keep
        description: Wetter-Overlay
    mode: parallel
    max: 10

  awtrix_ng_moodlight:
    alias: awtrix ng - moodlight
    sequence:
      - variables:
          prefix: "{{ prefix | default('awtrixng') }}"
          mode: "{{ mode | default('on') }}"
          color: "{{ color | default([255, 255, 255]) }}"
          kelvin: "{{ kelvin | default(0) }}"
          brightness: "{{ brightness | default(120) }}"
      - choose:
          # Aus
          - conditions:
              - condition: template
                value_template: "{{ mode == 'off' }}"
            sequence:
              - action: mqtt.publish
                data: { topic: "{{ prefix | default('awtrixng', true) }}/cmd/display/moodlight", payload: "" }
        # An – per Farbe oder Farbtemperatur (Kelvin)
        default:
          - action: mqtt.publish
            metadata: {}
            data:
              evaluate_payload: false
              qos: 0
              retain: false
              topic: "{{ prefix | default('awtrixng', true) }}/cmd/display/moodlight"
              payload: >-
                {% if (kelvin | int(0)) > 0 %}{"kelvin": {{ kelvin | int }}, "brightness": {{ brightness | int(120) }}}{% else %}{"color": {{ (color or [255,255,255]) | tojson }}, "brightness": {{ brightness | int(120) }}}{% endif %}
    description: >-
      Flutet das gesamte AWTRIX-NG-Panel mit einer Farbe (oder Farbtemperatur).
      Modus "aus" schaltet das Moodlight ab.
    icon: mdi:television-ambient-light
    fields:
      prefix:
        selector:
          text:
        name: prefix
        default: "awtrixng"
        description: MQTT-Prefix deiner AWTRIX-NG-Uhr (z. B. awtrixng)
      mode:
        selector:
          select:
            options:
              - label: "an"
                value: "on"
              - label: "aus"
                value: "off"
        name: mode
        default: "on"
        description: Moodlight ein-/ausschalten
      color:
        selector:
          color_rgb:
        name: color
        default:
          - 255
          - 255
          - 255
        description: Farbe (wird ignoriert, wenn Kelvin > 0)
      kelvin:
        selector:
          number:
            min: 0
            max: 6500
            step: 100
        name: kelvin
        default: 0
        description: Farbtemperatur in Kelvin (0 = Farbe verwenden)
      brightness:
        selector:
          number:
            min: 0
            max: 255
            step: 1
        name: brightness
        default: 120
        description: Helligkeit 0-255
    mode: parallel
    max: 10

  awtrix_ng_indicator:
    alias: awtrix ng - indicator
    sequence:
      - variables:
          prefix: "{{ prefix | default('awtrixng') }}"
          id: "{{ id | default(1) }}"
          mode: "{{ mode | default('set') }}"
          color: "{{ color | default([255, 0, 0]) }}"
          blink: "{{ blink | default(0) }}"
          fade: "{{ fade | default(0) }}"
      - choose:
          # Ausschalten / zurücksetzen
          - conditions:
              - condition: template
                value_template: "{{ mode == 'clear' }}"
            sequence:
              - action: mqtt.publish
                data:
                  topic: "{{ prefix | default('awtrixng', true) }}/cmd/indicators/{{ id | int(1) }}"
                  payload: "{}"
        # Setzen: Farbe + optional Blinken/Faden
        default:
          - action: mqtt.publish
            metadata: {}
            data:
              evaluate_payload: false
              qos: 0
              retain: false
              topic: "{{ prefix | default('awtrixng', true) }}/cmd/indicators/{{ id | int(1) }}"
              payload: >-
                {"color": {{ (color or [255,0,0]) | tojson }}{% if (blink | int(0)) > 0 %}, "blinkMs": {{ blink | int }}{% endif %}{% if (fade | int(0)) > 0 %}, "fadeMs": {{ fade | int }}{% endif %}}
    description: >-
      Setzt eine der drei seitlichen Status-LEDs (Indicators) auf AWTRIX NG –
      Farbe mit optionalem Blinken/Faden – oder schaltet sie aus.
    icon: mdi:led-on
    fields:
      prefix:
        selector:
          text:
        name: prefix
        default: "awtrixng"
        description: MQTT-Prefix deiner AWTRIX-NG-Uhr (z. B. awtrixng)
      id:
        selector:
          number:
            min: 1
            max: 3
            step: 1
        name: id
        default: 1
        required: true
        description: Indicator 1 (oben), 2 (mitte) oder 3 (unten)
      mode:
        selector:
          select:
            options:
              - label: "setzen"
                value: set
              - label: "aus"
                value: clear
        name: mode
        default: set
        description: Setzen oder ausschalten
      color:
        selector:
          color_rgb:
        name: color
        default:
          - 255
          - 0
          - 0
        description: Farbe der LED
      blink:
        selector:
          number:
            min: 0
            max: 5000
            step: 50
        name: blink
        default: 0
        description: Blinkintervall in ms (0 = aus)
      fade:
        selector:
          number:
            min: 0
            max: 5000
            step: 50
        name: fade
        default: 0
        description: Fade-Intervall in ms (0 = aus)
    mode: parallel
    max: 10

  awtrix_ng_sound:
    alias: awtrix ng - sound
    sequence:
      - variables:
          prefix: "{{ prefix | default('awtrixng') }}"
          mode: "{{ mode | default('play') }}"
          type: "{{ type | default('name') }}"
          value: "{{ value | default('') }}"
      - choose:
          # Stoppen
          - conditions:
              - condition: template
                value_template: "{{ mode == 'stop' }}"
            sequence:
              - action: mqtt.publish
                data: { topic: "{{ prefix | default('awtrixng', true) }}/cmd/sounds/stop", payload: "" }
        # Abspielen: gespeicherte Melodie (name), Inline-RTTTL (rtttl) oder Builtin
        default:
          - action: mqtt.publish
            metadata: {}
            data:
              evaluate_payload: false
              qos: 0
              retain: false
              topic: "{{ prefix | default('awtrixng', true) }}/cmd/sounds/play"
              payload: "{\"{{type}}\": \"{{value}}\"}"
    description: >-
      Spielt einen Sound auf AWTRIX NG ab (gespeicherte Melodie, Inline-RTTTL oder
      eingebauten Ton) oder stoppt die Wiedergabe.
    icon: mdi:music-note
    fields:
      prefix:
        selector:
          text:
        name: prefix
        default: "awtrixng"
        description: MQTT-Prefix deiner AWTRIX-NG-Uhr (z. B. awtrixng)
      mode:
        selector:
          select:
            options:
              - label: "abspielen"
                value: play
              - label: "stoppen"
                value: stop
        name: mode
        default: play
        description: Abspielen oder Stoppen
      type:
        selector:
          select:
            options:
              - label: "gespeicherte Melodie (name)"
                value: name
              - label: "Inline-RTTTL (rtttl)"
                value: rtttl
              - label: "eingebauter Ton (builtin)"
                value: builtin
        name: type
        default: name
        description: Quelle des Sounds (nur bei "abspielen")
      value:
        selector:
          text:
        name: value
        description: >-
          Dateiname / RTTTL-String / Builtin-Name (z. B. "beep", "r2d2" oder
          "two:d=4,o=5,b=200:c,e")
    mode: parallel
    max: 10

  awtrix_ng_radio:
    alias: awtrix ng - radio
    sequence:
      - variables:
          prefix: "{{ prefix | default('awtrixng') }}"
          mode: "{{ mode | default('play') }}"
          by: "{{ by | default('station') }}"
          value: "{{ value | default('') }}"
      - choose:
          # Stoppen
          - conditions:
              - condition: template
                value_template: "{{ mode == 'stop' }}"
            sequence:
              - action: mqtt.publish
                data: { topic: "{{ prefix | default('awtrixng', true) }}/cmd/radio/stop", payload: "" }
        # Abspielen: nach Stationsname, Index oder URL
        default:
          - action: mqtt.publish
            metadata: {}
            data:
              evaluate_payload: false
              qos: 0
              retain: false
              topic: "{{ prefix | default('awtrixng', true) }}/cmd/radio/play"
              payload: >-
                {% if by == 'index' %}{"index": {{ value | int(0) }}}{% else %}{"{{by}}": "{{value}}"}{% endif %}
    description: >-
      Startet oder stoppt die Radio-Wiedergabe auf AWTRIX NG (sofern das Gerät
      Audio-Ausgabe/Radio unterstützt).
    icon: mdi:radio
    fields:
      prefix:
        selector:
          text:
        name: prefix
        default: "awtrixng"
        description: MQTT-Prefix deiner AWTRIX-NG-Uhr (z. B. awtrixng)
      mode:
        selector:
          select:
            options:
              - label: "abspielen"
                value: play
              - label: "stoppen"
                value: stop
        name: mode
        default: play
        description: Abspielen oder Stoppen
      by:
        selector:
          select:
            options:
              - label: "Stationsname (station)"
                value: station
              - label: "Index (index)"
                value: index
              - label: "URL (url)"
                value: url
        name: by
        default: station
        description: Auswahlart (nur bei "abspielen")
      value:
        selector:
          text:
        name: value
        description: Stationsname / Index / Stream-URL
    mode: parallel
    max: 10

  awtrix_ng_settings:
    alias: awtrix ng - settings (brightness)
    sequence:
      - variables:
          prefix: "{{ prefix | default('awtrixng') }}"
          autobrightness: "{{ autobrightness | default(false) }}"
          brightness: "{{ brightness | default(120) }}"
      - action: mqtt.publish
        metadata: {}
        data:
          evaluate_payload: false
          qos: 0
          retain: false
          topic: "{{ prefix | default('awtrixng', true) }}/cmd/settings"
          payload: >-
            {"autoBrightness": {{ autobrightness | tojson }}{% if not autobrightness %}, "brightness": {{ brightness | int(120) }}{% endif %}}
    description: >-
      Setzt Helligkeit und Auto-Helligkeit auf AWTRIX NG. Bei aktiver
      Auto-Helligkeit wird der manuelle Wert weggelassen.
    icon: mdi:brightness-6
    fields:
      prefix:
        selector:
          text:
        name: prefix
        default: "awtrixng"
        description: MQTT-Prefix deiner AWTRIX-NG-Uhr (z. B. awtrixng)
      autobrightness:
        selector:
          boolean:
        name: autoBrightness
        default: false
        description: Automatische Helligkeit (Sensor) ein/aus
      brightness:
        selector:
          number:
            min: 0
            max: 255
            step: 1
        name: brightness
        default: 120
        description: Manuelle Helligkeit 0-255 (nur wenn Auto-Helligkeit aus)
    mode: parallel
    max: 10

  awtrix_ng_graph:
    alias: awtrix ng - graph
    sequence:
      - variables:
          prefix: "{{ prefix | default('awtrixng') }}"
          topicname: "{{ topicname | default('graph') }}"
          charttype: "{{ charttype | default('bar') }}"
          values: "{{ values | default('') }}"
          progress: "{{ progress | default(0) }}"
          text: "{{ text | default('') }}"
          icon: "{{ icon | default('') }}"
          color: "{{ color | default([0, 255, 0]) }}"
          autoscale: "{{ autoscale | default(true) }}"
          duration: "{{ duration | default(6) }}"
          lifetime: "{{ lifetime | default(0) }}"
          vals: >-
            {{ (values | default('')).split(',') | map('trim') | reject('equalto', '') | map('int', 0) | list }}
      - action: mqtt.publish
        metadata: {}
        data:
          evaluate_payload: false
          qos: 0
          retain: false
          topic: "{{ prefix | default('awtrixng', true) }}/cmd/apps/pushed/{{ topicname }}"
          payload: >-
            {
              "durationMs": {{ (duration | int(6)) * 1000 }},
              "lifetimeMs": {{ (lifetime | int(0)) * 1000 }}{% if text %},
              "text": "{{ text }}"{% endif %}{% if icon %},
              "icon": "{{ icon }}"{% endif %}{% if charttype == 'progress' %},
              "progress": {{ progress | int(0) }},
              "progressColor": {{ (color or [0,255,0]) | tojson }}{% elif charttype == 'line' %},
              "lineChart": {{ vals | tojson }},
              "chartAutoscale": {{ autoscale | tojson }},
              "chartColor": {{ (color or [0,255,0]) | tojson }}{% else %},
              "barChart": {{ vals | tojson }},
              "chartAutoscale": {{ autoscale | tojson }},
              "chartColor": {{ (color or [0,255,0]) | tojson }}{% endif %}
            }
    description: >-
      Zeigt ein Balken-/Linien-Diagramm oder einen Fortschrittsbalken als Pushed App
      auf AWTRIX NG (max. 16 Werte).
    icon: mdi:chart-bar
    fields:
      prefix:
        selector:
          text:
        name: prefix
        default: "awtrixng"
        description: MQTT-Prefix deiner AWTRIX-NG-Uhr (z. B. awtrixng)
      topicname:
        selector:
          text:
        name: topicname
        default: graph
        description: App-Name (Topic). Nur A-Z a-z 0-9 _ -
      charttype:
        selector:
          select:
            options:
              - label: "Balken (barChart)"
                value: bar
              - label: "Linie (lineChart)"
                value: line
              - label: "Fortschritt (progress)"
                value: progress
        name: charttype
        default: bar
        description: Diagramm-Typ
      values:
        selector:
          text:
        name: values
        description: 'Werte fuer Balken/Linie, kommagetrennt (max. 16), z. B. "3,5,8,4,9"'
      progress:
        selector:
          number:
            min: 0
            max: 100
            step: 1
        name: progress
        default: 0
        description: Fortschritt 0-100 (nur bei Typ "Fortschritt")
      text:
        selector:
          text:
        name: text
        description: Optionaler Text neben dem Diagramm
      icon:
        selector:
          text:
        name: icon
        description: Optionale Icon-ID
      color:
        selector:
          color_rgb:
        name: color
        default:
          - 0
          - 255
          - 0
        description: Diagramm-/Balkenfarbe
      autoscale:
        selector:
          boolean:
        name: autoscale
        default: true
        description: Automatisch skalieren (nur Balken/Linie)
      duration:
        selector:
          number:
            min: 1
            max: 180
            step: 1
        name: duration
        default: 6
        description: Anzeigedauer in Sekunden
      lifetime:
        selector:
          number:
            min: 0
            max: 86400
            step: 1
        name: lifetime
        default: 0
        description: App nach X Sekunden verwerfen - 0 = nie
    mode: parallel
    max: 10

  awtrix_ng_reboot:
    alias: awtrix ng - reboot
    sequence:
      - variables:
          prefix: "{{ prefix | default('awtrixng') }}"
      - action: mqtt.publish
        metadata: {}
        data:
          evaluate_payload: false
          qos: 0
          retain: false
          topic: "{{ prefix | default('awtrixng', true) }}/cmd/device/reboot"
          payload: ""
    description: "Startet die AWTRIX-NG-Uhr neu."
    icon: mdi:restart
    fields:
      prefix:
        selector:
          text:
        name: prefix
        default: "awtrixng"
        description: MQTT-Prefix deiner AWTRIX-NG-Uhr (z. B. awtrixng)
    mode: single
