alias: awtrix ng - radio
sequence:
  - choose:
      # Stoppen
      - conditions:
          - condition: template
            value_template: "{{ mode == 'stop' }}"
        sequence:
          - action: mqtt.publish
            data: { topic: "{{ prefix | default('awtrix', true) }}/cmd/radio/stop", payload: "" }
    # Abspielen: nach Stationsname, Index oder URL
    default:
      - action: mqtt.publish
        metadata: {}
        data:
          evaluate_payload: false
          qos: 0
          retain: false
          topic: "{{ prefix | default('awtrix', true) }}/cmd/radio/play"
          payload: >-
            {% if by == 'index' %}{"index": {{ value | int(0) }}}{% else %}{"{{by}}": "{{value}}"}{% endif %}
description: >-
  Startet oder stoppt die Radio-Wiedergabe auf AWTRIX NG (sofern das Gerät
  Audio-Ausgabe/Radio unterstützt).
icon: mdi:radio
fields:
  prefix:
    selector:
      text: {}
    name: prefix
    default: "awtrix"
    description: MQTT-Prefix deiner AWTRIX-NG-Uhr (z. B. awtrixng)
  mode:
    selector:
      select:
        options:
          - label: "abspielen"
            value: play
          - label: "stoppen"
            value: stop
    name: mode
    default: play
    description: Abspielen oder Stoppen
  by:
    selector:
      select:
        options:
          - label: "Stationsname (station)"
            value: station
          - label: "Index (index)"
            value: index
          - label: "URL (url)"
            value: url
    name: by
    default: station
    description: Auswahlart (nur bei "abspielen")
  value:
    selector:
      text: {}
    name: value
    description: Stationsname / Index / Stream-URL
mode: parallel
max: 10
