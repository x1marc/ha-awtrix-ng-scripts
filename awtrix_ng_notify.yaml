alias: awtrix ng - notify
sequence:
  - variables:
      prefix: "{{ prefix | default('awtrixng') }}"
      text: "{{ text | default('') }}"
      icon: "{{ icon | default('') }}"
      duration: "{{ duration | default(7) }}"
      hold: "{{ hold | default(false) }}"
      stack: "{{ stack | default(true) }}"
      wakeup: "{{ wakeup | default(false) }}"
      center: "{{ center | default(false) }}"
      blink: "{{ blink | default(false) }}"
      rainbow: "{{ rainbow | default(false) }}"
      textcolor: "{{ textcolor | default([255, 255, 255]) }}"
      effect: "{{ effect | default('none') }}"
      sound: "{{ sound | default('') }}"
      iconmode: "{{ iconmode | default('fixed') }}"
      scrollspeed: "{{ scrollspeed | default(80) }}"
      palette: "{{ palette | default('none') }}"
      scrollmode: "{{ scrollmode | default('keep') }}"
      repeat: "{{ repeat | default(0) }}"
  - action: mqtt.publish
    metadata: {}
    data:
      evaluate_payload: false
      qos: 0
      retain: false
      topic: "{{ prefix | default('awtrixng', true) }}/cmd/notify"
      payload: |-
        {
          "text": "{{text}}",
          "durationMs": {{ (duration | int(7)) * 1000 }},
          "stack": {{ stack | tojson }},
          "hold": {{ hold | tojson }},
          "wakeup": {{ wakeup | tojson }},
          "textCenter": {{ center | tojson }},
          "scroll": {"speed": {{ scrollspeed | int(80) }}{% if scrollmode != 'keep' %}, "mode": "{{ scrollmode }}"{% endif %}}{% if icon %},
          "icon": "{{icon}}","iconMode":"{{iconmode}}"{% endif %}{% if blink %},
          "textBlinkMs": 500{% endif %}{% if effect not in ['none','',None] %},
          "effect": "{{effect}}"{% endif %}{% if (repeat | int(0)) > 0 %},
          "repeat": {{ repeat | int }}{% endif %}{% if sound %},
          "sound": "{{sound}}"{% endif %}{% if rainbow or palette not in ['none','',None] %},
          "palette": "{{ 'Rainbow' if rainbow else palette }}",
          "textColor": "palette"{% else %},
          "textColor": {{ (textcolor or [255,255,255]) | tojson }}{% endif %}
        }
description: "Sendet eine Notification an AWTRIX NG (überlagert die laufenden Apps)."
icon: mdi:bell-ring
fields:
  prefix:
    selector:
      text:
    name: prefix
    default: "awtrixng"
    description: >-
      MQTT-Prefix deiner Uhr. Steht in der AWTRIX-Weboberflaeche unter
      Settings -> MQTT ("Prefix"). Der Standard "awtrixng" passt fuer die
      meisten - nur aendern, wenn deine Uhr einen anderen Prefix nutzt.
  text:
    selector:
      text:
    name: text
    required: true
    description: Der Benachrichtigungstext, z. B. "Post da!". Scrollt bei Bedarf. (Pflicht)
  icon:
    selector:
      text:
    name: icon
    description: Icon-Nummer (optional), muss auf der Uhr liegen. Leer = kein Icon.
  iconmode:
    selector:
      select:
        options:
          - label: "fest (bleibt stehen)"
            value: fixed
          - label: "einmal wegschieben"
            value: pushOnce
          - label: "mitscrollen (wiederholt)"
            value: push
    name: iconMode
    default: fixed
    description: >-
      Wie sich das Icon verhaelt, wenn Text scrollt: fest (bleibt stehen),
      einmal wegschieben, oder mitscrollen.
  scrollspeed:
    selector:
      number:
        min: 0
        max: 200
        step: 5
    name: scrollSpeed
    default: 80
    description: Wie schnell langer Text scrollt (Standard 80; kleiner = langsamer).
  duration:
    selector:
      number:
        min: 1
        max: 180
        step: 1
    name: duration
    default: 7
    description: Wie lange die Meldung angezeigt wird (Sekunden). Bei "halten" = an ohne Wirkung.
  hold:
    selector:
      boolean:
    name: hold
    default: false
    description: An = Meldung bleibt stehen, bis du sie am Geraet/per Skript wegwischst.
  stack:
    selector:
      boolean:
    name: stack
    default: true
    description: An = einreihen (nacheinander). Aus = laufende Meldung sofort ersetzen.
  wakeup:
    selector:
      boolean:
    name: wakeup
    default: false
    description: An = schaltet das Display ein, falls es gerade aus ist.
  center:
    selector:
      boolean:
    name: center
    default: false
    description: An = kurzer Text wird mittig angezeigt.
  blink:
    selector:
      boolean:
    name: blink
    default: false
    description: An = der Text blinkt.
  rainbow:
    selector:
      boolean:
    name: rainbow
    default: false
    description: Text in Regenbogenfarben (an/aus).
  textcolor:
    selector:
      color_rgb:
    name: textcolor
    default:
      - 255
      - 255
      - 255
    description: Textfarbe (Farbwaehler). Wird bei Rainbow/Palette ignoriert.
  effect:
    selector:
      select:
        options:
          - label: "kein Effekt"
            value: none
          - label: Fade
            value: Fade
          - label: MovingLine
            value: MovingLine
          - label: BrickBreaker
            value: BrickBreaker
          - label: PingPong
            value: PingPong
          - label: Radar
            value: Radar
          - label: Checkerboard
            value: Checkerboard
          - label: Fireworks
            value: Fireworks
          - label: PlasmaCloud
            value: PlasmaCloud
          - label: Ripple
            value: Ripple
          - label: Snake
            value: Snake
          - label: Pacifica
            value: Pacifica
          - label: TheaterChase
            value: TheaterChase
          - label: Plasma
            value: Plasma
          - label: Matrix
            value: Matrix
          - label: SwirlIn
            value: SwirlIn
          - label: SwirlOut
            value: SwirlOut
          - label: LookingEyes
            value: LookingEyes
          - label: TwinklingStars
            value: TwinklingStars
          - label: ColorWaves
            value: ColorWaves
    name: effect
    default: none
    description: Hintergrundeffekt (NG). "kein Effekt" = keiner.
  sound:
    selector:
      text:
    name: sound
    description: Ton beim Anzeigen (optional) - Name einer Melodie, die auf der Uhr gespeichert ist.
  palette:
    selector:
      select:
        options:
          - label: "keine Palette"
            value: none
          - label: Rainbow
            value: Rainbow
          - label: Cloud
            value: Cloud
          - label: Lava
            value: Lava
          - label: Ocean
            value: Ocean
          - label: Forest
            value: Forest
          - label: Stripe
            value: Stripe
          - label: Party
            value: Party
          - label: Heat
            value: Heat
    name: palette
    default: none
    description: >-
      Faerbt den Text als Farbverlauf (z. B. Rainbow). "keine Palette" =
      normale Textfarbe (siehe Feld "textcolor").
  scrollmode:
    selector:
      select:
        options:
          - label: "Standard (Geraet)"
            value: keep
          - label: "static (kein Scrollen)"
            value: static
          - label: wrap
            value: wrap
          - label: loop
            value: loop
          - label: bounce
            value: bounce
    name: scrollMode
    default: keep
    description: >-
      Wie der Text laeuft: Standard (Uhr entscheidet), static (kein Scrollen),
      wrap/loop/bounce.
  repeat:
    selector:
      number:
        min: 0
        max: 20
        step: 1
    name: repeat
    default: 0
    description: Wie oft langer Text komplett durchlaeuft, bevor er verschwindet. 0 = stattdessen Anzeigedauer nutzen.
mode: parallel
max: 10
