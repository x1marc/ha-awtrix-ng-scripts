alias: awtrix ng - reboot
sequence:
  - variables:
      prefix: "{{ prefix | default('awtrix') }}"
  - action: mqtt.publish
    metadata: {}
    data:
      evaluate_payload: false
      qos: 0
      retain: false
      topic: "{{ prefix | default('awtrix', true) }}/cmd/device/reboot"
      payload: ""
description: "Startet die AWTRIX-NG-Uhr neu."
icon: mdi:restart
fields:
  prefix:
    selector:
      text:
    name: prefix
    default: "awtrix"
    description: MQTT-Prefix deiner AWTRIX-NG-Uhr (z. B. awtrixng)
mode: single
