alias: awtrix ng - delete app
sequence:
  - variables:
      prefix: "{{ prefix | default('awtrix') }}"
      topicname: "{{ topicname | default('') }}"
  - action: mqtt.publish
    metadata: {}
    data:
      evaluate_payload: false
      qos: 0
      retain: false
      topic: "{{ prefix | default('awtrix', true) }}/cmd/apps/pushed/{{topicname}}"
      payload: ""
description: "Löscht eine Pushed App auf AWTRIX NG (leeres Payload)."
icon: mdi:delete
fields:
  prefix:
    selector:
      text:
    name: prefix
    default: "awtrix"
    description: MQTT-Prefix deiner AWTRIX-NG-Uhr (z. B. awtrixng)
  topicname:
    selector:
      text:
    name: topicname
    required: true
    description: Name der zu löschenden App
mode: parallel
max: 10
